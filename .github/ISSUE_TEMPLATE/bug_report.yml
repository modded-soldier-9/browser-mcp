name: "🐛 Bug Report"
description: "File a bug report to help us reproduce and fix the issue"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Clear, minimal reproduction steps help us locate and resolve issues quickly.
        Before submitting, please verify that the issue has not already been reported by searching the [issue tracker](https://github.com/modded-soldier-9/browser-mcp/issues).

  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "e.g. browser_navigate fails to resolve internal tab state when navigating to redirected URLs."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the problem.
      placeholder: |
        1. Start the MCP server: `browser-mcp`
        2. In client (e.g. Claude Code / Antigravity), invoke `browser_navigate` with URL '...'
        3. Observe the error response
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "The browser should navigate to the destination URL and return page status."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages or unexpected responses.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Browser MCP Version
      description: Run `browser-mcp --version` or check `extension/manifest.json`.
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser & Version
      description: Which browser is the extension loaded in?
      options:
        - Google Chrome (Latest Stable)
        - Brave Browser (Latest Stable)
        - Microsoft Edge
        - Chromium
        - Other (specify in description)
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11 / Windows 10
        - macOS (Apple Silicon / M-series)
        - macOS (Intel)
        - Linux (Ubuntu / Debian)
        - Linux (Arch / Fedora / Other)
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: Connected AI Client
      options:
        - Claude Code
        - Antigravity / Gemini Code
        - Cursor
        - OpenCode
        - Claude Desktop
        - Windsurf
        - Custom MCP Client
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs & Terminal Output
      description: Stderr output from `browser-mcp` or console output from Chrome DevTools background/offscreen page.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Validation Checklist
      options:
        - label: "I have searched existing issues and verified this hasn't been reported yet."
          required: true
        - label: "I have tested with the latest release of Browser MCP."
          required: false
        - label: "I have provided minimal reproduction steps and relevant system information."
          required: true
