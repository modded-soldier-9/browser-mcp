<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="coreGradient" x1="256" y1="224" x2="256" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="256" y1="76" x2="256" y2="436" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141d2e"/>
      <stop offset="100%" stop-color="#0c121e"/>
    </linearGradient>
    <radialGradient id="halo" cx="256" cy="280" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Calm Round Outer Squircle Container -->
  <rect x="8" y="8" width="496" height="496" rx="124" fill="#080c14" stroke="#1e293d" stroke-width="4"/>

  <!-- Centered Calm Orbit Ring -->
  <circle cx="256" cy="256" r="220" stroke="#162236" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Centered Rounded Browser Card -->
  <rect x="76" y="76" width="360" height="360" rx="56" fill="url(#cardGlow)" stroke="#22334d" stroke-width="3"/>

  <!-- Window Chrome: Three Calm Dots -->
  <circle cx="118" cy="120" r="6.5" fill="#2d3f5c"/>
  <circle cx="138" cy="120" r="6.5" fill="#2d3f5c"/>
  <circle cx="158" cy="120" r="6.5" fill="#2d3f5c"/>

  <!-- Centered Omnibox Pill -->
  <rect x="184" y="104" width="192" height="32" rx="16" fill="#162032" stroke="#293c5a" stroke-width="1.5"/>
  <circle cx="202" cy="120" r="4" fill="#38bdf8"/>
  <text x="216" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" letter-spacing="0.4">browser-mcp</text>
  <circle cx="360" cy="120" r="4" fill="#34d399"/>

  <!-- Header Divider -->
  <line x1="98" y1="154" x2="414" y2="154" stroke="#1a273c" stroke-width="2" stroke-linecap="round"/>

  <!-- Calm Centered Core Glow -->
  <circle cx="256" cy="278" r="100" fill="url(#halo)"/>
  <circle cx="256" cy="278" r="76" fill="none" stroke="#1c2b42" stroke-width="2"/>
  <circle cx="256" cy="278" r="54" fill="#111826" stroke="#273a56" stroke-width="2"/>

  <!-- Centered Radiant MCP Spark / Star -->
  <path d="M 256 230 C 256 258 256 278 228 278 C 256 278 256 298 256 326 C 256 298 256 278 284 278 C 256 278 256 258 256 230 Z" fill="url(#coreGradient)"/>
  <circle cx="256" cy="278" r="6" fill="#ffffff"/>

  <!-- Orbiting Tab/Agent Nodes (Smooth Rounded Satellites) -->
  <circle cx="192" cy="236" r="8" fill="#162235" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="320" cy="236" r="8" fill="#162235" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="192" cy="320" r="8" fill="#162235" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="320" cy="320" r="8" fill="#162235" stroke="#60a5fa" stroke-width="2"/>

  <!-- Bottom Centered 43 Tools Pill -->
  <rect x="194" y="380" width="124" height="26" rx="13" fill="#141e30" stroke="#293c5a" stroke-width="1.5"/>
  <text x="256" y="397" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#e2e8f0" letter-spacing="1">43 TOOLS</text>
</svg>