[package]
name = "browser-mcp-server"
version = "2.0.0"
edition = "2024"
description = "Native high-performance Rust MCP server for Browser MCP driving Brave and Chrome."
authors = ["Mohamed Elsheikh <moddedsoldier@gmail.com>"]
repository = "https://github.com/modded-soldier-9/browser-mcp"
homepage = "https://github.com/modded-soldier-9/browser-mcp"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
sysinfo = "0.31"
url = "2.5"
regex = "1.10"
