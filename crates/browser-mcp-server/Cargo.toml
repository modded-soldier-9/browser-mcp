[package]
name = "browser-control-server"
version = "1.0.0"
edition = "2024"
description = "Browser Control - Native Rust MCP server driving Brave and Chrome."
authors = ["Mohamed Elsheikh <moddedsoldier@gmail.com>"]
repository = "https://github.com/modded-soldier-9/browser-mcp"
homepage = "https://github.com/modded-soldier-9/browser-mcp"
license = "MIT"

[lib]
name = "browser_control_server"
path = "src/lib.rs"

[[bin]]
name = "browser-control"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
url = "2.5"
regex = "1.10"
include_dir = "0.7"

